name: Sync to Hugging Face Space

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: FlyingNunchucks/07-tool-using-agent
          hf_token: ${{ secrets.HF_DEPLOY_TOKEN }}
          repo_type: space
          space_sdk: gradio
